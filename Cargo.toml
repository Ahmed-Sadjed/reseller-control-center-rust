[package]
name = "reseller-control-center-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
actix-rt = "2.10"
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "json", "rust_decimal"] }
redis = { version = "0.27", features = ["tokio-native-tls-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
argon2 = "0.5"
jsonwebtoken = "9.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
rust_decimal = { version = "1.35", features = ["serde"] }
aes-gcm = "0.10"
actix-multipart = "0.7"
futures-util = "0.3"

[dev-dependencies]
actix-test = "0.1"
